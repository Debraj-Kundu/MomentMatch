version: '3.9'

services:

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      # Mount Nginx configuration file
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Volume for persistent SSD image cache
      - nginx-cache:/var/cache/nginx/minio_cache
    depends_on:
      - minio
    restart: unless-stopped
    networks:
      - grabpic-network
      
  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_DB: grabpic
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d grabpic" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - grabpic-network

  minio:
    image: minio/minio
    container_name: minio

    ports:
      - "9000:9000"
      - "9001:9001"
    
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 12345678
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
      MINIO_NOTIFY_WEBHOOK_ENABLE_grabpic: on
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_grabpic: http://172.31.192.1:8081/api/v1/webhooks/minio

    command: server /data --console-address ":9001"

    volumes:
      - minio-data:/data

    restart: unless-stopped

    networks:
      - grabpic-network

  redis:
    image: redis:7-alpine
    container_name: redis

    ports:
      - "6379:6379"

    restart: unless-stopped

    networks:
      - grabpic-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    restart: unless-stopped
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis
    networks:
      - grabpic-network

  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: pgadmin

  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@grabpic.com
