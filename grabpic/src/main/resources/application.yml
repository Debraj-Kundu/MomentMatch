server:
  port: 8081

spring:

  application:
    name: grabpic

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/grabpic}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:12345}

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
      
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms

      # Connection pooling
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_ACCESS_KEY:admin}
  secret-key: ${STORAGE_SECRET_KEY:12345678}
  bucket: ${STORAGE_BUCKET:media-private}

jwt:
  secret: ${JWT_SECRET:grabpic-super-secret-key-for-development-only-123456789}
  access-token-expiration: 36000000

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

image-processor:
  base-url: ${IMAGE_PROCESSOR_URL:http://localhost:8002}

image-processor-client:
  max-connections: 100
  acquire-timeout: 5s
  idle-time: 20s
  life-time: 60s
  response-timeout: 5s